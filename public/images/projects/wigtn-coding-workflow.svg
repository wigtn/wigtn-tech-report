<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#F7F8FA"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10V0Z" fill="#98A2B3"/>
    </marker>
  </defs>

  <text x="96" y="104" fill="#1457D9" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="3">
    WIGTN CODING
  </text>
  <text x="96" y="170" fill="#111827" font-family="IBM Plex Sans, Arial, sans-serif" font-size="54" font-weight="600">
    From idea to reviewed delivery
  </text>
  <text x="96" y="214" fill="#667085" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24">
    Six explicit handoffs keep ownership, context and release evidence visible.
  </text>

  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="96" y="316" width="210" height="176" rx="18" fill="white" stroke="#D0D5DD" stroke-width="2"/>
    <text x="122" y="358" fill="#1457D9" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="2">01 DEFINE</text>
    <text x="122" y="410" fill="#111827" font-size="30" font-weight="600">Produce</text>
    <text x="122" y="446" fill="#111827" font-size="30" font-weight="600">a PRD</text>

    <path d="M306 404H346" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="358" y="316" width="210" height="176" rx="18" fill="white" stroke="#D0D5DD" stroke-width="2"/>
    <text x="384" y="358" fill="#1457D9" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="2">02 CHALLENGE</text>
    <text x="384" y="410" fill="#111827" font-size="30" font-weight="600">Review in</text>
    <text x="384" y="446" fill="#111827" font-size="30" font-weight="600">parallel</text>

    <path d="M568 404H608" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="620" y="316" width="210" height="176" rx="18" fill="white" stroke="#D0D5DD" stroke-width="2"/>
    <text x="646" y="358" fill="#1457D9" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="2">03 DESIGN</text>
    <text x="646" y="410" fill="#111827" font-size="30" font-weight="600">Inspect, then</text>
    <text x="646" y="446" fill="#111827" font-size="30" font-weight="600">decide</text>

    <path d="M830 404H870" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="882" y="316" width="210" height="176" rx="18" fill="white" stroke="#D0D5DD" stroke-width="2"/>
    <text x="908" y="358" fill="#1457D9" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="2">04 BUILD</text>
    <text x="908" y="410" fill="#111827" font-size="30" font-weight="600">Bounded</text>
    <text x="908" y="446" fill="#111827" font-size="30" font-weight="600">ownership</text>

    <path d="M1092 404H1132" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1144" y="316" width="210" height="176" rx="18" fill="white" stroke="#D0D5DD" stroke-width="2"/>
    <text x="1170" y="358" fill="#1457D9" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="2">05 REVIEW</text>
    <text x="1170" y="410" fill="#111827" font-size="30" font-weight="600">Apply quality</text>
    <text x="1170" y="446" fill="#111827" font-size="30" font-weight="600">gates</text>

    <path d="M1249 492V550" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1144" y="566" width="210" height="176" rx="18" fill="#1457D9"/>
    <text x="1170" y="608" fill="#DCE8FF" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="2">06 RELEASE</text>
    <text x="1170" y="660" fill="white" font-size="30" font-weight="600">Stop or</text>
    <text x="1170" y="696" fill="white" font-size="30" font-weight="600">publish</text>
  </g>

  <text x="96" y="630" fill="#667085" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="2">
    SHARED MEMORY
  </text>
  <line x1="96" y1="658" x2="1048" y2="658" stroke="#D0D5DD" stroke-width="2"/>

  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <circle cx="112" cy="710" r="8" fill="#1457D9"/>
    <text x="138" y="720" fill="#111827" font-size="27" font-weight="600">Repository memory</text>
    <text x="138" y="758" fill="#667085" font-size="21">Conventions and architectural rules</text>

    <circle cx="112" cy="816" r="8" fill="#1457D9"/>
    <text x="138" y="826" fill="#111827" font-size="27" font-weight="600">Shared context</text>
    <text x="138" y="864" fill="#667085" font-size="21">Contracts, ownership and decisions</text>

    <circle cx="610" cy="710" r="8" fill="#1457D9"/>
    <text x="636" y="720" fill="#111827" font-size="27" font-weight="600">Task state</text>
    <text x="636" y="758" fill="#667085" font-size="21">Progress, blockers and verification</text>
  </g>

  <circle cx="1486" cy="900" r="18" fill="#8B5CF6"/>
</svg>
