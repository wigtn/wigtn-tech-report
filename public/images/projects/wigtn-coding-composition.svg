<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" width="1600" height="900">
  <title>Plugin composition at three points: February 2026, March 2026 and today</title>
  <!--
    Counts are directory listings at each commit, not estimates. February comes
    from the v2.0.0 commit body; March from the second v3 streamline commit;
    today from a checkout of main on 2026-08-09.

    The shape carries the argument: the agent row barely moves while the skill
    row collapses. What we deleted was knowledge, not roles.
  -->
  <style>
    .row { font: 600 33px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
    .val { font: 600 29px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .leg { font: 26px system-ui, -apple-system, Segoe UI, sans-serif; fill: #667085; }
    .hd  { font: 600 31px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
    .note{ font: 25px system-ui, -apple-system, Segoe UI, sans-serif; fill: #667085; }
  </style>

  <text class="hd" x="60" y="60">Components shipped in the plugin</text>

  <!-- legend -->
  <g class="leg">
    <rect x="60" y="88" width="26" height="18" fill="#C3CCDA"/><text x="98" y="104">2026.02.14</text>
    <rect x="290" y="88" width="26" height="18" fill="#8FB0EA"/><text x="328" y="104">2026.03.09</text>
    <rect x="520" y="88" width="26" height="18" fill="#1457D9"/><text x="558" y="104">Today</text>
  </g>

  <!-- Agents: 12 / 12 / 11 -->
  <text class="row" x="60" y="212">Agents</text>
  <g>
    <rect x="330" y="160" width="456" height="40" fill="#C3CCDA"/>
    <text class="val" x="806" y="189" fill="#667085">12</text>
    <rect x="330" y="212" width="456" height="40" fill="#8FB0EA"/>
    <text class="val" x="806" y="241" fill="#667085">12</text>
    <rect x="330" y="264" width="418" height="40" fill="#1457D9"/>
    <text class="val" x="768" y="293" fill="#1457D9">11</text>
  </g>

  <!-- Commands: 9 / 3 / 6 -->
  <text class="row" x="60" y="422">Commands</text>
  <g>
    <rect x="330" y="370" width="342" height="40" fill="#C3CCDA"/>
    <text class="val" x="692" y="399" fill="#667085">9</text>
    <rect x="330" y="422" width="114" height="40" fill="#8FB0EA"/>
    <text class="val" x="464" y="451" fill="#667085">3</text>
    <rect x="330" y="474" width="228" height="40" fill="#1457D9"/>
    <text class="val" x="578" y="503" fill="#1457D9">6</text>
  </g>

  <!-- Skills: 29 / 3 / 7 -->
  <text class="row" x="60" y="632">Skills</text>
  <g>
    <rect x="330" y="580" width="1102" height="40" fill="#C3CCDA"/>
    <text class="val" x="1452" y="609" fill="#667085">29</text>
    <rect x="330" y="632" width="114" height="40" fill="#8FB0EA"/>
    <text class="val" x="464" y="661" fill="#667085">3</text>
    <rect x="330" y="684" width="266" height="40" fill="#1457D9"/>
    <text class="val" x="616" y="713" fill="#1457D9">7</text>
  </g>

  <line x1="60" y1="782" x2="1540" y2="782" stroke="#E4E7EC" stroke-width="2"/>
  <text class="note" x="60" y="826">The agent row is flat and the skill row is not. Roles survived every cut;</text>
  <text class="note" x="60" y="858">the twenty-two skills that documented React, Tailwind and Jest did not.</text>
</svg>
